# Local infrastructure for Priority Agent.
#   docker compose up -d            → PostgreSQL 16 + Redis 7
#   docker compose --profile app up → also builds and runs the web app and the worker
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: priority_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d priority_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://priority_app:priority_app@postgres:5432/priority_agent
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/priority_agent
      REDIS_URL: redis://redis:6379
      JOB_RUNNER: queue
      RUN_MIGRATIONS: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://priority_app:priority_app@postgres:5432/priority_agent
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/priority_agent
      REDIS_URL: redis://redis:6379
      JOB_RUNNER: queue
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
